<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0C0B" />
    <meta
      name="description"
      content="Veritas - manage FiveM player records, online or offline: jobs, ranks and balances."
    />

    <!-- Link preview when the panel URL is pasted in Discord or Slack
         Image path is relative: the panel has no fixed public host to hard-code -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veritas" />
    <meta property="og:title" content="Veritas - every citizen, on the record" />
    <meta
      property="og:description"
      content="Manage FiveM player records, online or offline: jobs, ranks, balances, assets and bans."
    />
    <meta property="og:image" content="/brand/veritas-og-1200x630.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Veritas wordmark over a dark skyline, with the line: every citizen, on the record"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon: the Veritas mark (tile with a V cut out) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cmask id='m'%3E%3Crect x='4' y='5' width='22' height='24' rx='3.5' fill='%23fff'/%3E%3Cpath d='M9.5 9 15 21.5 20.5 9' fill='none' stroke='%23000' stroke-width='4.2'/%3E%3C/mask%3E%3Crect x='4' y='5' width='22' height='24' rx='3.5' fill='%23EDE9E1' mask='url(%23m)'/%3E%3Cpath d='M20.5 9 24.8 0.9' stroke='%23EDE9E1' stroke-width='4.2'/%3E%3C/svg%3E"
    />

    <!-- Self-hosted fonts (public/fonts, index.css): no internet needed on a LAN -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/spline-sans-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Veritas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
